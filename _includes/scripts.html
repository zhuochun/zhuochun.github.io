{% if page.menu %}
<script src="/js/headings.js" defer></script>
{% elsif page.search %}
<script src="/js/search.js" defer></script>
{% endif %}

{% if page.script %}{% for script in page.script %}
<script src="{{ script }}" defer></script>
{% endfor %}{% endif %}

{% if site.ga4_measurement_id and site.ga4_measurement_id != "" and site.ga4_measurement_id != "G-XXXXXXXXXX" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_measurement_id }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{ site.ga4_measurement_id }}');
</script>
{% endif %}
